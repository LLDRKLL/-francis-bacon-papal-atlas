# Optional manual deployment for users who explicitly choose GitHub Actions as Pages source.
# The simpler documented source is main /docs; GitHub handles that branch deployment itself.
# No automatic push trigger here, to avoid competing with branch-based Pages publishing.
name: Publish artwork atlas to GitHub Pages (optional manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate static entrypoint
        run: |
          test -s docs/index.html
          test -s docs/data.json
          test -s docs/research.md
          node --check docs/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
