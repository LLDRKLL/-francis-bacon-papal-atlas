name: Prepare verified career research images
on:
  push:
    branches: [main]
    paths: ['scripts/build_career_assets.py', '.github/workflows/career-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install image validation dependencies
        run: python -m pip install 'Pillow>=11,<13' 'beautifulsoup4>=4.12,<5'
      - name: Download and verify catalogue reference images
        run: python scripts/build_career_assets.py
      - name: Preserve reviewed sources and images in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/career-artworks.json docs/career-images/
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified career artwork metadata and local reference panels'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
