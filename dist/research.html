<script>
'use strict';
let reportText='',works=[],imageMap={};

function render(md){let lines=md.replace(/\r/g,'').split('\n'),out=[],toc=[],h=0;for(let i=0;i<lines.length;){let s=lines[i];if(!s.trim()){i++;continue;}let m=s.match(/^(#{1,3}) (.+)$/);if(m){let level=m[1].length,id=`section-${h++}`;if(m[2]==='参考文献与查阅范围')id='sources';out.push(`<h${level} id="${id}"${h===2?' class="subtitle"':''}>${inline(m[2])}</h${level}>`);if(level===2&&h>2)toc.push(`<a href="#${id}">${esc(m[2])}</a>`);i++;continue;}if(/^<a id="[a-z0-9]+"><\/a>$/.test(s)){out.push(s);i++;continue;}if(s.startsWith('> ')){let p=[];while(i<lines.length&&lines[i].startsWith('> '))p.push(lines[i++].slice(2));out.push('<blockquote><p>'+inline(p.join(' '))+'</p></blockquote>');continue;}if(s.startsWith('|')&&lines[i+1]?.match(/^\|[\s:|\-]+\|$/)){let rows=[];while(i<lines.length&&lines[i].startsWith('|'))rows.push(lines[i++]);let html='<div class="table-scroll"><table>';rows.forEach((r,j)=>{if(j===1)return;let tag=j===0?'th':'td';html+='<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>';});out.push(html+'</table></div>');continue;}if(s.startsWith('![')){out.push(inline(s));i++;continue;}let p=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,3} |> |<a id=|\|)/.test(lines[i]))p.push(lines[i++]);if(!p.length){p.push(lines[i++]);}out.push('<p>'+inline(p.join(' '))+'</p>');}$('#toc').innerHTML=toc.join('');return out.join('\n');}
const routes=[['谁在看谁？',['49-07','56-06'],'比较张口、眼睛的可见程度与回望。沉默不等于安宁，模糊也不自动等于丧失主体性。'],['颜料越少，强度越低？',['53-02','53-12'],'比较面孔与躯干的完成程度。把“画得稀薄”与“人物显得虚弱”先分开，再检验两者如何相接。'],['共同肉身取消等级吗？',['54-14','60-07'],'观察肉／动物与人物的尺度、位置和边界。先辨认仍被保留的差别，再讨论共同性。'],['旧作返回改变了什么？',['62-02','71-04'],'区分构图、镜中人物与后见之明。“1962”是返回的旧作年代；第二版本绘于1971年4月，早于戴尔同年10月去世。']];
function compare(n){const r=routes[n];$('#compare-note').textContent=r[2];$('#compare-grid').innerHTML=r[1].map(id=>{let w=works.find(x=>x.cr===id);return w?`<figure><img src="${esc(imageURL(w.localImage))}" alt="${esc(w.zh)}" data-cr="${esc(id)}"><figcaption><h3>${esc(w.zh)}</h3><p>${esc(w.year)} · CR ${id}<br>${esc(w.collection)}<br>${esc(w.dimensions)}</p><a href="index.html#work-${id}" data-cr="${id}">展开图像与资料 ↗</a></figcaption></figure>`:'<p>作品资料未载入。</p>';}).join('');document.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.route===n));}
function showWork(id,path){const w=works.find(x=>x.cr===id||x.localImage===path);if(!w)return;$('#dialog-title').textContent=`${w.zh} · ${w.year} · CR ${w.cr}`;const atlas=window.__OFFLINE__?'https://bacon-papal-atlas.lldrkaikrdll.chatgpt.site/':'index.html';$('#dialog-body').innerHTML=`<div class="dialog-image"><img id="large-image" src="${esc(imageURL(w.localImage))}" alt="${esc(w.zh)}"></div><div><p><strong>${esc(w.title)}</strong><br>${esc(w.medium)}<br>${esc(w.dimensions)}</p><p>${esc(w.collection)}<br>收藏记录不等于当前展出。</p><p id="pixel-note"></p><p>${esc(w.reading||'')}</p><p><a href="${esc(w.source)}" target="_blank" rel="noreferrer">官方目录原条目 ↗</a></p><p><a href="${atlas}#work-${encodeURIComponent(w.cr)}" target="_blank" rel="noreferrer">在完整图谱中查看 ↗</a></p></div>`;const im=$('#large-image');im.onload=()=>$('#pixel-note').textContent=`本文件参考图：${im.naturalWidth} × ${im.naturalHeight} 像素。屏幕放大不会产生额外绘画细节。`;if(im.complete&&im.naturalWidth)im.onload();$('#work-dialog').showModal();}
document.addEventListener('click',e=>{let el=e.target.closest('[data-cr],[data-image]');if(el){e.preventDefault();showWork(el.dataset.cr,el.dataset.image);}});$('#dialog-close').onclick=()=>$('#work-dialog').close();$('#work-dialog').addEventListener('click',e=>{if(e.target===$('#work-dialog'))$('#work-dialog').close();});$('#toc-toggle').onclick=()=>{let open=$('#toc').classList.toggle('open');$('#toc-toggle').setAttribute('aria-expanded',open);$('#toc-toggle').textContent=open?'收起章节目录':'展开章节目录';};$('#save-md').onclick=()=>{let u=URL.createObjectURL(new Blob([reportText],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='bacon-papal-research.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);};addEventListener('scroll',()=>{let max=document.documentElement.scrollHeight-innerHeight;$('#progress').style.width=(max>0?scrollY/max*100:0)+'%';},{passive:true});
async function init(){try{if(window.__RESEARCH__){reportText=window.__RESEARCH__.markdown;works=window.__RESEARCH__.works;imageMap=window.__RESEARCH__.images||{};}else{let [m,d]=await Promise.all([fetch('research.md'),fetch('data.json')]);if(!m.ok||!d.ok)throw Error('研究文件暂未载入');reportText=await m.text();works=(await d.json()).works;}$('#report').innerHTML=render(reportText);$('#compare-tabs').innerHTML=routes.map((r,n)=>`<button data-route="${n}" aria-pressed="${n===0}">${n+1} · ${esc(r[0])}</button>`).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>compare(+b.dataset.route));compare(0);if(window.__OFFLINE__){$('#atlas-link').href='https://bacon-papal-atlas.lldrkaikrdll.chatgpt.site/';}if(location.hash&&document.getElementById(location.hash.slice(1)))document.getElementById(location.hash.slice(1)).scrollIntoView();}catch(e){$('#report').innerHTML='<p class="load-error">无法载入研究文件。请通过网站打开此页，或使用已打包的单文件版本。<a href="research.md">阅读Markdown正文</a></p>';console.error(e);}}
init();
